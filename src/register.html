<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ asset(request, 'style.css') }}" />
  <title>Login</title>  
</head>

<body class="body-main">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="sidebar-logo">
      <i class="fas fa-vote-yea text-blue-600 text-xl"></i> 
      <span class="logo-text">E-Lection</span>
    </div>
  </nav>

  <!-- Card Wrapper -->
  <main class="form-main">
    <div class="form-card">
     
      <!-- Icon -->
      <div class="form-icon circle-icon">
        <i class="fa-solid fa-lock text-white text-2xl"></i>
      </div>
      
      <!-- Title -->
      <h2 class="form-title">Create Account</h2>
      <p class="form-subtitle">Register to participate in e-voting</p>

      {% if error %}
      <div class="alert-error">{{ error }}</div>
      {% endif %}

      {% if success %}
      <div class="alert-success">{{ success }}</div>
      {% endif %}

      <!-- Form -->
      <form id="registerForm" class="space-y-4 text-left" action="/register" method="post">
        
        <!-- Name Fields -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="firstName" class="form-label">First Name</label>
            <input id="firstName" name="firstName" type="text" placeholder="John"
              class="form-input" value="{{ (form_data or {}).get('firstName', '') }}" required />
          </div>
          <div>
            <label for="lastName" class="form-label">Last Name</label>
            <input id="lastName" name="lastName" type="text" placeholder="Doe"
              class="form-input" value="{{ (form_data or {}).get('lastName', '') }}" required />
          </div>
        </div>

        <!-- Student ID -->
        <div>
          <label for="studentId" class="form-label">Student ID</label>
          <input id="studentId" name="studentId" type="text" placeholder="2022400001"
            class="form-input" value="{{ (form_data or {}).get('studentId', '') }}" required />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="form-label">Email Address</label>
          <input id="email" name="email" type="email" placeholder="john.doe@gmail.com"
            class="form-input" value="{{ (form_data or {}).get('email', '') }}" required />
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-login w-full mt-4">
          Create Account
        </button>
      </form>

      <!-- Login Link -->
      <div class="form-footer">
        <p>
          Already have an account?
          <a href="/login" class="blue-underline">Sign in</a>
        </p>
      </div>
    </div>
  </main>
  <script>
    // Password fields removed; no toggles needed.
  </script>
</body>
</html>
