<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <title>Register</title>  
</head>

<body class="body-main">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="sidebar-logo">
      <i class="fas fa-vote-yea text-blue-600 text-xl"></i> 
      <span class="logo-text">E-Lection</span>
    </div>
  </nav>

  <!-- Card Wrapper -->
  <main class="form-main">
    <div class="form-card">
     
      <!-- Icon -->
      <img src="https://cdn-icons-png.flaticon.com/512/6543/6543058.png" 
           alt="Register Icon" 
           class="form-icon" />
      
      <!-- Title -->
      <h2 class="form-title">Create Account</h2>
      <p class="form-subtitle">Register to participate in secure voting</p>

      {% if error %}
      <div class="alert-error">{{ error }}</div>
      {% endif %}

      {% if success %}
      <div class="alert-success">{{ success }}</div>
      {% endif %}

      <!-- Form -->
      <form id="registerForm" class="space-y-4 text-left" action="/register" method="post">
        
        <!-- Name Fields -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="firstName" class="form-label">First Name</label>
            <input id="firstName" name="firstName" type="text" placeholder="John"
              class="form-input" value="{{ (form_data or {}).get('firstName', '') }}" required />
          </div>
          <div>
            <label for="lastName" class="form-label">Last Name</label>
            <input id="lastName" name="lastName" type="text" placeholder="Doe"
              class="form-input" value="{{ (form_data or {}).get('lastName', '') }}" required />
          </div>
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="form-label">Email Address</label>
          <input id="email" name="email" type="email" placeholder="john.doe@university.edu"
            class="form-input" value="{{ (form_data or {}).get('email', '') }}" required />
        </div>

        <!-- Student ID -->
        <div>
          <label for="studentId" class="form-label">Student ID</label>
          <input id="studentId" name="studentId" type="text" placeholder="2024001"
            class="form-input" value="{{ (form_data or {}).get('studentId', '') }}" required />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="form-label">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" placeholder="Create a strong password"
              class="form-input pr-12" required />
            <button type="button" onclick="togglePassword('password')"
              class="password-toggle">
              <i class="fas fa-eye" id="password-eye"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div class="relative">
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm your password"
              class="form-input pr-12" required />
            <button type="button" onclick="togglePassword('confirmPassword')"
              class="password-toggle">
              <i class="fas fa-eye" id="confirmPassword-eye"></i>
            </button>
          </div>
        </div>

        <!-- Terms -->
        <div class="flex items-center space-x-2">
          <input id="terms" name="terms" type="checkbox" class="rounded border-gray-300" required />
          <label for="terms" class="form-label">
            I agree to the
            <a href="#" class="text-blue-600 hover:underline">Terms of Service</a> and
            <a href="#" class="text-blue-600 hover:underline">Privacy Policy</a>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-login w-full">
          Create Account
        </button>
      </form>

      <!-- Login Link -->
      <div class="form-footer">
        <p>
          Already have an account?
          <a href="/login" class="text-blue-600 hover:underline font-medium">Sign in here</a>
        </p>
      </div>
    </div>
  </main>
  <script>
    function togglePassword(id) {
      const input = document.getElementById(id);
      const icon = document.getElementById(id + '-eye');
      if (!input || !icon) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</body>
</html>
