<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ asset(request, 'tailwind.css') }}" />
  <link href="/static/vendor/fontawesome/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ asset(request, 'style.css') }}" />
  <title>Login</title>  
</head>

<body class="body-main">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="sidebar-logo">
      <i class="fas fa-vote-yea text-blue-600 text-xl"></i>
      <span class="logo-text">E-Lection</span>
    </div>
  </nav>
  
  <!-- Main-->
  <main class="form-main">
    <div class="form-card">
      
      <!-- Icon -->
      <div class="form-icon circle-icon">
        <i class="fa-solid fa-lock text-white text-2xl"></i>
      </div>
      
      <!-- Title -->
      <h2 class="form-title">Login</h2>
      <p class="form-subtitle">Sign in with your account</p>

      {% if success %}
      <div class="alert-success">{{ success | e }}</div>
      {% endif %}

      {% if error %}
      <div class="alert-error">{{ error | e }}</div>
      {% endif %}

      <!-- Button -->
      <div class="login-stack">
        {% if ms_enabled %}
        <a href="/login/microsoft" class="btn btn-microsoft">
          <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft logo" class="w-5 h-5">
          <span>Continue with SU Email</span>
        </a>
        {% endif %}
      </div>

      <!-- Register -->
      <div class="form-footer">
        <p>
          Don't have an account?
          <a href="/register" class="blue-underline">Register</a>
        </p>
      </div>
    </div>
  </main>

  <script nonce="{{ csp_nonce(request) }}"></script>
  <script nonce="{{ csp_nonce(request) }}" src="{{ asset(request, 'app.js') }}" defer></script>
</body>
</html>
