<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <title>Admin Login</title>
</head>

<body class="body-main">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="sidebar-logo">
      <i class="fas fa-vote-yea text-blue-600 text-xl"></i>
      <span class="logo-text">E-Lection</span>
    </div>
  </nav>

  <!-- Main -->
  <main class="form-main">
    <div class="form-card">

      <!-- Icon -->
      <div class="form-icon circle-icon">
        <i class="fa-solid fa-lock text-white text-2xl"></i>
      </div>
      
      <!-- Title -->
      <h2 class="form-title">Admin Login</h2>
      <p class="form-subtitle">Sign in with your admin account</p>

      {% if error %}
      <div class="alert-error">{{ error }}</div>
      {% endif %}

      <!-- Form -->
      <form id="loginForm" class="space-y-4 text-left" action="/admin" method="post">
        <!-- Email -->
        <div>
          <label for="email" class="form-label">Email Address</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="Enter your email"
            class="form-input"
            value="{{ (form_data or {}).get('email', '') }}"
            required
          />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="form-label">Password</label>
          <div class="relative">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              class="form-input pr-12"
              required
            />
            <button
              type="button"
              onclick="togglePassword('password')"
              class="password-toggle"
            >
              <i class="fas fa-eye" id="password-eye"></i>
            </button>
          </div>
        </div>

        <!-- Button -->
        <button type="submit" class="btn btn-login w-full">
          Sign In as Admin
        </button>
      </form>

    </div>
  </main>

  <script>
    function togglePassword(id) {
      const input = document.getElementById(id);
      const icon = document.getElementById(id + '-eye');
      if (!input || !icon) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</body>
</html>
